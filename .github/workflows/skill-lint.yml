name: Skill Lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # skill-lint 3.1.0+ also auto-detects .claude-plugin/marketplace.json and
      # fails on version drift against the plugin manifests it points at.
      - uses: himself65/skill-lint@v3
        with:
          path: 'plugins'
